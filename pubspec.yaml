name: tv_track
description: "Track the TV shows and movies you watch."
publish_to: 'none'
version: 1.0.3+1

environment:
  sdk: ^3.12.0

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.6.0
  collection: ^1.19.1
  dio: ^5.11.0
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_file_store: ^1.2.3
  firebase_auth: ^6.5.4
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  hooks_riverpod: ^3.3.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  # Android adaptive icon: brand charcoal background, symbol in the foreground.
  adaptive_icon_background: "#12100D"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
