version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Cloud Functions and the Android build have their own lockfiles and were not tracked.
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
