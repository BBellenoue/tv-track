<!doctype html>
<meta charset="utf-8">
<title>TV Track social preview</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono&display=swap">
<style>
:root{--black:#12100D;--charcoal:#1C1915;--tungsten:#E7A33C;--linen:#EFE9DD;--dust:#9C9284;--outline:#3A342B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px}
body{background:var(--black);font-family:"Barlow Semi Condensed",sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(560px 460px at 79% 48%,rgba(231,163,60,.15),transparent 70%),
  radial-gradient(900px 620px at 6% 112%,rgba(231,163,60,.05),transparent 72%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(239,233,221,.03) 0 1px,transparent 1px 4px)}
.frame{position:absolute;inset:28px;border:1px solid rgba(58,52,43,.9);border-radius:8px}
.wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 88px 0 96px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:var(--tungsten)}
h1{font-weight:700;font-size:132px;line-height:1;letter-spacing:.05em;color:var(--linen);text-transform:uppercase;white-space:nowrap;margin:22px 0 0}
.rule{width:72px;height:3px;background:var(--tungsten);margin:30px 0 26px}
p{font-weight:600;font-size:31px;line-height:1.34;letter-spacing:.012em;color:var(--dust);max-width:600px}
p b{color:var(--linen);font-weight:600}
.meta{font-family:"IBM Plex Mono",monospace;font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--outline);margin-top:40px}
.meta span{color:var(--dust)}
.mark{flex:none;margin-right:8px}
</style>
<div class="glow"></div><div class="scan"></div><div class="frame"></div>
<div class="wrap">
  <div>
    <div class="eyebrow">Self-hosted TV&nbsp;Time alternative</div>
    <h1>TV&nbsp;Track</h1>
    <div class="rule"></div>
    <p>Track the shows and movies you watch.<br><b>Your Firebase, your keys, your data</b>:<br>no feed, no audience.</p>
    <div class="meta"><span>TheTVDB</span> &nbsp;·&nbsp; <span>TMDB</span> &nbsp;·&nbsp; <span>Flutter</span> &nbsp;·&nbsp; <span>MIT</span></div>
  </div>
  <svg class="mark" width="300" height="300" viewBox="0 0 200 200" fill="none">
    <defs>
      <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="7" result="b1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b2"/>
        <feMerge>
          <feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="b1"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <g filter="url(#neon)" stroke="#E7A33C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="26" y="52" width="148" height="104" rx="18"/>
      <path d="M104 117 L119 133 L149 94"/>
    </g>
  </svg>
</div>
